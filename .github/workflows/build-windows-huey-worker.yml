name: Build Windows Huey Worker and Queue Simulator

on:
  push:
    branches: [ main, master, huey-build, windows/huey-build, optimized-windows/huey-build, stray, cc, diarization, model-persistence, model-presistence, queue/reduce-size, face-recog/queue ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      - name: Install project dependencies
        run: |
          pip install -e .
      
      - name: Install CUDA-enabled PyTorch
        run: |
          pip uninstall -y torch torchvision torchaudio
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
      
      - name: Install PyInstaller
        run: |
          pip install pyinstaller>=6.17.0
      
      - name: Build huey_worker executable with PyInstaller
        run: |
          pyinstaller huey_worker_windows.spec --clean --noconfirm
      
      - name: Build queue_simulator executable with PyInstaller
        run: |
          pyinstaller queue_simulator_windows.spec --clean --noconfirm
      
      - name: Verify huey_worker executable exists
        run: |
          if (Test-Path "dist\huey_worker.exe") {
            Write-Host "huey_worker.exe built successfully"
            $fileInfo = Get-Item "dist\huey_worker.exe"
            Write-Host "   Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          } else {
            Write-Host "huey_worker.exe not found!"
            exit 1
          }
      
      - name: Verify queue_simulator executable exists
        run: |
          if (Test-Path "dist\queue_simulator.exe") {
            Write-Host "queue_simulator.exe built successfully"
            $fileInfo = Get-Item "dist\queue_simulator.exe"
            Write-Host "   Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          } else {
            Write-Host "queue_simulator.exe not found!"
            exit 1
          }
      
      - name: Upload huey_worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-huey-worker
          path: dist/huey_worker.exe
          retention-days: 1
          if-no-files-found: error
      
      - name: Upload queue_simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-queue-simulator
          path: dist/queue_simulator.exe
          retention-days: 1
          if-no-files-found: error
      
      # MinIO configuration
      # Configure these secrets in GitHub: Settings > Secrets and variables > Actions
      # MINIO_ENDPOINT: https://minio.media-meter.in
      # MINIO_ACCESS_KEY: app-user
      # MINIO_SECRET_KEY: minio123456
      # MINIO_BUCKET: artifacts (optional, defaults to 'artifacts')
      
      - name: Install MinIO client
        run: |
          $mcVersion = "20241013214739.0.0"
          $mcUrl = "https://dl.min.io/client/mc/release/windows-amd64/archive/mc.$mcVersion.windows-amd64.zip"
          $mcZip = "$env:TEMP\mc.zip"
          $mcDir = "$env:TEMP\mc"
          Invoke-WebRequest -Uri $mcUrl -OutFile $mcZip
          Expand-Archive -Path $mcZip -DestinationPath $mcDir -Force
          $env:PATH = "$mcDir;$env:PATH"
          echo "$mcDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
      - name: Configure MinIO alias
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          mc alias set minio $env:MINIO_ENDPOINT $env:MINIO_ACCESS_KEY $env:MINIO_SECRET_KEY
      
      - name: Upload huey_worker to MinIO
        env:
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET || 'artifacts' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $bucket = $env:MINIO_BUCKET
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $branch = $env:GITHUB_REF_NAME -replace '[^a-zA-Z0-9]', '-'
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $path = "windows/huey-worker/$branch/$sha-$timestamp/huey_worker.exe"
          mc cp dist/huey_worker.exe minio/$bucket/$path
          Write-Host "✅ Uploaded to minio/$bucket/$path"
      
      - name: Upload queue_simulator to MinIO
        env:
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET || 'artifacts' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $bucket = $env:MINIO_BUCKET
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $branch = $env:GITHUB_REF_NAME -replace '[^a-zA-Z0-9]', '-'
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $path = "windows/queue-simulator/$branch/$sha-$timestamp/queue_simulator.exe"
          mc cp dist/queue_simulator.exe minio/$bucket/$path
          Write-Host "✅ Uploaded to minio/$bucket/$path"

