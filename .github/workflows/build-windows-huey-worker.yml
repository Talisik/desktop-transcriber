name: Build Windows Executables

on:
  push:
    branches: [ main, master, staging, face-recog/queue ]  # Trigger on push to main/master/staging/face-recog/queue branches
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      - name: Install munchkin-chunker from private repo
        env:
          BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
        run: |
          pip install "git+https://x-token-auth:$($env:BITBUCKET_TOKEN)@bitbucket.org/metawhale/munchkin_chunker.git"

      - name: Configure git credentials for private repo
        env:
          BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
        run: |
          git config --global url."https://x-token-auth:$($env:BITBUCKET_TOKEN)@bitbucket.org/".insteadOf "https://bitbucket.org/"

      - name: Install project dependencies
        run: |
          pip install -e .
      
      - name: Install CUDA-enabled PyTorch
        run: |
          pip uninstall -y torch torchvision torchaudio
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
      
      - name: Install torchcodec
        run: |
          pip install torchcodec --index-url https://download.pytorch.org/whl/cu121
      
      - name: Install PyInstaller
        run: |
          pip install pyinstaller>=6.17.0
      
      - name: Build huey_worker executable with PyInstaller
        run: |
          pyinstaller huey_worker_windows.spec --clean --noconfirm
      
