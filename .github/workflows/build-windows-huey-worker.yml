name: Build Windows Huey Worker

on:
  push:
    branches: [ main, master, huey-build, windows/huey-build, optimized-windows/huey-build ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      - name: Install project dependencies
        run: |
          pip install -e .
      
      - name: Install PyInstaller
        run: |
          pip install pyinstaller>=6.17.0
      
      - name: Build huey_worker executable with PyInstaller
        run: |
          pyinstaller huey_worker_windows.spec --clean
      
      - name: Upload huey_worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-huey-worker
          path: dist/huey_worker.exe
          retention-days: 30

