name: Build Windows Executables

on:
  push:
    branches: [ main, master, staging, face-recog/queue ]  # Trigger on push to main/master/staging/face-recog/queue branches
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      # - name: Configure git credentials for private repo
      #   run: |
      #     git config --global credential.helper store
      #     $credential = "https://x-token-auth:${{ secrets.BITBUCKET_TOKEN }}@bitbucket.org"
      #     $credential | Out-File -FilePath "$env:USERPROFILE\.git-credentials" -Encoding utf8 -NoNewline
      
      - name: Install resource_tracker dependencies
        run: |
          # Only install what's needed for resource_tracker - skip full project install
          # to avoid pulling in munchkin-chunker and other heavy dependencies
          pip install psutil>=5.9.0
      
      # - name: Install CUDA-enabled PyTorch
