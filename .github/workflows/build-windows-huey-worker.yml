name: Build Windows Huey Worker and Queue Simulator

on:
  push:
    branches: [ main, master, huey-build, windows/huey-build, optimized-windows/huey-build, stray, cc, diarization, model-persistence, model-presistence ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      - name: Install project dependencies
        run: |
          pip install -e .
      
      - name: Install PyInstaller
        run: |
          pip install pyinstaller>=6.17.0
      
      - name: Build huey_worker executable with PyInstaller
        run: |
          pyinstaller huey_worker_windows.spec --clean --noconfirm
      
      - name: Build queue_simulator executable with PyInstaller
        run: |
          pyinstaller queue_simulator_windows.spec --clean --noconfirm
      
      - name: Verify huey_worker executable exists
        run: |
          if (Test-Path "dist\huey_worker.exe") {
            Write-Host "huey_worker.exe built successfully"
            $fileInfo = Get-Item "dist\huey_worker.exe"
            Write-Host "   Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          } else {
            Write-Host "huey_worker.exe not found!"
            exit 1
          }
      
      - name: Verify queue_simulator executable exists
        run: |
          if (Test-Path "dist\queue_simulator.exe") {
            Write-Host "queue_simulator.exe built successfully"
            $fileInfo = Get-Item "dist\queue_simulator.exe"
            Write-Host "   Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          } else {
            Write-Host "queue_simulator.exe not found!"
            exit 1
          }
      
      - name: Upload huey_worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-huey-worker
          path: dist/huey_worker.exe
          retention-days: 1
          if-no-files-found: error
      
      - name: Upload queue_simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-queue-simulator
          path: dist/queue_simulator.exe
          retention-days: 30
          if-no-files-found: error

