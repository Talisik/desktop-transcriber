      - name: Verify huey_worker executable exists
        run: |
          if (Test-Path "dist\huey_worker\huey_worker.exe") {
            Write-Host "huey_worker.exe built successfully"
            $fileInfo = Get-Item "dist\huey_worker\huey_worker.exe"
            Write-Host "   Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          } else {
            Write-Host "huey_worker.exe not found!"
            exit 1
          }
      
